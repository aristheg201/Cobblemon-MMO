plugins { id 'fabric-loom' version "${loom_version}" }

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:MdwFAVRL:${cobblemon_modrinth_version}"
    // Cobblemon 1.8.0 bundles Fabric Language Kotlin 1.13.6 + Kotlin 2.2.20.
    // This is compile-only: Alpha-Encounter still has no additional runtime dependency.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    // LuckPerms remains optional at runtime. Compile against API 5.4 to match the
    // LuckPerms Fabric 5.4.x line used by Minecraft 1.21.1 servers.
    compileOnly "net.luckperms:api:5.4"
    // Adventure/MiniMessage is bundled so formatting works without another server mod.
    modImplementation include("net.kyori:adventure-platform-fabric:5.14.2")
    // Text Placeholder API remains optional at runtime.
    modCompileOnly "eu.pb4:placeholder-api:2.4.2+1.21"
}

tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
processResources { filesMatching('fabric.mod.json') { expand version: project.version } }
