plugins { id 'fabric-loom' version '1.7.4' apply false }
subprojects {
    apply plugin: 'fabric-loom'
    group='vn.svframe.fantasyhub'
    version='0.1.0'
    repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    java { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
    processResources { inputs.property('version',project.version); filesMatching('fabric.mod.json') { expand version:project.version } }
}
project(':core') {
    base.archivesName='FantasyHubCore'
    if(rootProject.hasProperty('frameworkBundle'))repositories { flatDir { dirs rootProject.property('frameworkBundle') } }
    dependencies {
        implementation project(path: ':protocol', configuration: 'namedElements')
        include project(':protocol')
        modImplementation files(rootProject.file('../SVFrameLib/build/libs/SVFrameLib-1.7.2-fabric.jar'))
        modImplementation files(rootProject.file('../SVFrameMMO/build/libs/SVFrameMMO-1.13.2-fabric.jar'))
        if(rootProject.hasProperty('frameworkBundle')){
            include 'vn.svframe.local:SVFrameLib:1.7.2-fabric'
            include 'vn.svframe.local:SVFrameMMO:1.13.2-fabric'
            include 'vn.svframe.local:SVFrameItems:0.1.1-fabric'
            include 'vn.svframe.local:SVFrameMobs:0.1.0-fabric'
            include 'vn.svframe.local:SVFrameMMO-Cobblemon-Integration:0.1.17'
        }
    }
    sourceSets.main.resources.srcDir('src/imported/resources')
}
project(':client') {
    base.archivesName='FantasyHubClient'
    dependencies { implementation project(path: ':protocol', configuration: 'namedElements'); include project(':protocol') }
    // Owned/generated assets are supplied locally; source archives are not a CI dependency.
    sourceSets.main.resources.srcDir('src/imported/resources')
    processResources {
        for(String module:['SVFrameLib','SVFrameMMO','SVFrameMMOCobblemon']) {
            from(rootProject.file('../'+module+'/src/main/resources')) { include 'assets/**/lang/*.json' }
        }
    }
}
project(':protocol') { base.archivesName='FantasyHubProtocol' }
