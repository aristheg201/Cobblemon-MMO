plugins { id 'fabric-loom' version '1.7.4' apply false }
subprojects {
    apply plugin: 'fabric-loom'
    group='vn.svframe.fantasyhub'
    // Original Rider equipment and matching client presentation.
    version=project.name in ['core','client','protocol'] ? '0.2.3' : '0.1.0'
    repositories { mavenCentral(); maven { url='https://maven.fabricmc.net/' } }
    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    java { sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21; withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
    processResources { inputs.property('version',project.version); filesMatching('fabric.mod.json') { expand version:project.version } }
}
project(':core') {
    base.archivesName='FantasyHubCore'
    dependencies { compileOnly 'org.yaml:snakeyaml:2.3'; testImplementation 'org.yaml:snakeyaml:2.3' }
    dependencies { testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    if(rootProject.hasProperty('frameworkBundle'))repositories { flatDir { dirs rootProject.property('frameworkBundle') } }
    dependencies {
        implementation project(path: ':protocol', configuration: 'namedElements')
        include project(':protocol')
        modImplementation files(rootProject.file('../SVFrameLib/build/libs/SVFrameLib-1.7.2-fabric.jar'))
        modImplementation files(rootProject.file('../SVFrameMMO/build/libs/SVFrameMMO-1.13.4-fabric.jar'))
        modImplementation files(rootProject.file('../SVFrameItems').isDirectory()
                ? rootProject.file('../SVFrameItems/build/libs/SVFrameItems-0.1.2-fabric.jar')
                : rootProject.file('../../items/SVFrameItems/build/libs/SVFrameItems-0.1.2-fabric.jar'))
        if(rootProject.hasProperty('frameworkBundle')){
            include 'vn.svframe.local:SVFrameLib:1.7.2-fabric'
            include 'vn.svframe.local:SVFrameMMO:1.13.4-fabric'
            include 'vn.svframe.local:SVFrameItems:0.1.2-fabric'
            include 'vn.svframe.local:SVFrameMobs:0.1.2-fabric'
            include 'vn.svframe.local:SVFrameMMO-Cobblemon-Integration:0.1.18'
        }
    }
    sourceSets.main.resources.srcDir('src/imported/resources')
}
project(':client') {
    base.archivesName='FantasyHubClient'
    dependencies { testImplementation platform('org.junit:junit-bom:5.11.4'); testImplementation 'org.junit.jupiter:junit-jupiter'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    dependencies { implementation project(path: ':protocol', configuration: 'namedElements'); include project(':protocol') }
    // Owned/generated assets are supplied locally; source archives are not a CI dependency.
    sourceSets.main.resources.srcDir('src/imported/resources')
    processResources {
        from(rootProject.file('skript/src/main/resources')) { include 'assets/**/lang/*.json' }
        from(rootProject.file('../SVFrameItems').isDirectory() ? rootProject.file('../SVFrameItems/src/main/resources') : rootProject.file('../../items/SVFrameItems/src/main/resources')) { include 'assets/**/lang/*.json' }
        for(String module:['SVFrameLib','SVFrameMMO','SVFrameMMOCobblemon']) {
            from(rootProject.file('../'+module+'/src/main/resources')) { include 'assets/**/lang/*.json' }
        }
        // Index the final merged mod resources, not a stale authoring snapshot.
        doLast {
            def resourceRoot = destinationDir.toPath()
            // geo/ is shared with GeckoLib/AzureLib, which scan every namespace.
            // Reject private/native formats here before producing an unloadable JAR.
            fileTree(new File(destinationDir, 'assets/fantasyhub/geo')).matching { include '**/*.json' }.files.each { file ->
                def geometry = new groovy.json.JsonSlurper().parse(file)['minecraft:geometry']
                if (!(geometry instanceof List) || geometry.isEmpty())
                    throw new GradleException("Non-Bedrock model in reserved geo/ directory: ${file}. Use native_geometry/ for native formats.")
            }
            // A targeted armor export must not drop existing summon models.
            def riderModels = fileTree(new File(destinationDir, 'assets/fantasyhub/models/item/riders')).matching { include '**/*.json' }.files.collect { file ->
                'fantasyhub:' + new File(destinationDir, 'assets/fantasyhub/models').toPath().relativize(file.toPath()).toString().replace('\\', '/').replaceAll(/\.json$/, '')
            }.sort()
            new File(destinationDir, 'assets/fantasyhub/riders-models.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(riderModels)) + '\n'
            def index = new TreeMap<String, String>()
            fileTree(destinationDir).matching { include 'assets/**', 'resourcepacks/**'; exclude '**/asset-index.json' }.files.each { file ->
                def path = resourceRoot.relativize(file.toPath()).toString().replace('\\', '/')
                index[path] = java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
            }
            def target = new File(destinationDir, 'assets/fantasyhub/asset-index.json')
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(index)) + '\n'
        }
    }
}
project(':protocol') { base.archivesName='FantasyHubProtocol' }
// Exact outputs for the local packaging script; old releases may coexist in build/libs.
tasks.register('localArtifactPaths') {
    dependsOn ':core:build', ':client:build'
    doLast {
        def outputs = ['core', 'client'].collectEntries { name ->
            [(name): project(":" + name).tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath]
        }
        def target = layout.buildDirectory.file('local-artifacts.json').get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(outputs)) + '\n'
    }
}
project(':skript') {
    base.archivesName='SVFrameSkript'
    dependencies {
        modImplementation files(rootProject.file('../SVFrameLib/build/libs/SVFrameLib-1.7.2-fabric.jar'))
        modImplementation files(rootProject.file('../SVFrameMMO/build/libs/SVFrameMMO-1.13.4-fabric.jar'))
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach { useJUnitPlatform(); if(rootProject.hasProperty("suppliedScripts"))systemProperty "suppliedScripts",rootProject.property("suppliedScripts") }
}
