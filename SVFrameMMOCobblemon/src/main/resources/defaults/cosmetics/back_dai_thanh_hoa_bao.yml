id: back_dai_thanh_hoa_bao
slot: BACK
name: "Đại Thánh Hỏa Bào"
permission: svframemmo.cobblemon.cosmetic.use.back_dai_thanh_hoa_bao

# Sun Wukong / Đại Thánh Trở Về-inspired flame mantle.
# Vanilla flame draws the cape silhouette; the finite Snowstorm ember burst is the Cobblemon fire core.
backend: MINECRAFT
particle: minecraft:flame
count: 2
spread: 0.025
speed: 0.004
hide-without-resource-pack: false

fallback:
  particle: minecraft:flame
  count: 2
  spread: 0.04
  speed: 0.006

phases:
  EQUIP_BURST:
    # A short ignition wave down the spine. The custom Cobblemon Snowstorm emitter is finite (~1.1s).
    - backend: COBBLEMON
      particle: ember_burst
      delay-ticks: 0
      repetitions: 1
      anchor: BACK
      offset-x: 0.00
      offset-y: 0.31
      offset-z: -0.30
      broadcast-radius: 28
      max-viewers: 32
    - backend: COBBLEMON
      particle: ember_burst
      delay-ticks: 3
      repetitions: 1
      anchor: BACK
      offset-x: 0.00
      offset-y: 0.02
      offset-z: -0.41
      broadcast-radius: 28
      max-viewers: 32
