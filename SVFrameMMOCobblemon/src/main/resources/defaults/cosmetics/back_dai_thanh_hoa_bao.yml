      particle: minecraft:flame
      delay-ticks: 0
      repetitions: 3
      interval-ticks: 2
      anchor: BACK
      offset-x: -0.48
      offset-y: 0.34
      offset-z: -0.24
      count: 4
      spread: 0.06
      speed: 0.015
      broadcast-radius: 28
      max-viewers: 32
