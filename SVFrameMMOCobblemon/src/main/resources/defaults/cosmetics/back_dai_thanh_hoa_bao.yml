id: back_dai_thanh_hoa_bao
slot: BACK
name: "Đại Thánh Hỏa Bào"
permission: svframemmo.cobblemon.cosmetic.use.back_dai_thanh_hoa_bao

# Đại Thánh Trở Về-inspired battle mantle:
# - deep crimson particle cloth
# - hot orange/gold vanilla flame border
# - finite Cobblemon/Snowstorm ember surges
# - progressively stronger drag/lift/sway toward the free tail
backend: MINECRAFT
particle: minecraft:flame
count: 1
spread: 0.02
speed: 0.003
hide-without-resource-pack: false

fallback:
