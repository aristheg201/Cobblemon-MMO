id: back_dai_thanh_hoa_bao
slot: BACK
name: "Đại Thánh Hỏa Bào"
permission: svframemmo.cobblemon.cosmetic.use.back_dai_thanh_hoa_bao

# YAML-ONLY cosmetic. No Java/JAR patch is required for this design.
# Hero Is Back-inspired mantle built from Cobblemon's Flamethrower impact fire:
# broad burning shoulders -> dense middle sheet -> long split trailing tails.
#
# Why flamethrower_target instead of flamethrower_actor?
# - target is a large 1x1 fire billboard with a finite lifetime (~0.5s)
# - it has no hard-coded world firing direction
# - local BACK offsets therefore rotate correctly with the player using the existing renderer
# - actor fires toward world -Z when spawned as a standalone Snowstorm packet
backend: COBBLEMON
particle: cobblemon:flamethrower_target
hide-without-resource-pack: false

fallback:
  particle: minecraft:flame
  count: 3
  spread: 0.06
  speed: 0.006

phases:
