    # Shoulder ignition.
    - backend: COBBLEMON
      particle: cobblemon:flamethrower_target
      repetitions: 2
      interval-ticks: 3
      anchor: BACK
      offset-x: -0.62
      offset-y: 0.46
      offset-z: -0.64
      broadcast-radius: 28
      max-viewers: 24

    - backend: COBBLEMON
      particle: cobblemon:flamethrower_target
      delay-ticks: 1
      repetitions: 2
      interval-ticks: 3
