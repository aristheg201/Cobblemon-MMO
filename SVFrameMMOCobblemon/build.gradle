plugins { id 'fabric-loom' version "${loom_version}" }
group = 'vn.svframe'
version = project.mod_version
base { archivesName = 'SVFrameMMO-Cobblemon-Integration' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.wispforest.io/releases/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    modImplementation "maven.modrinth:MdwFAVRL:kF7CvxTo"
    modImplementation "eu.pb4:polymer-core:0.9.19+1.21.1"
    modImplementation "eu.pb4:polymer-resource-pack:0.9.19+1.21.1"
    modImplementation "dev.architectury:architectury-fabric:13.0.8"
    modImplementation "io.wispforest:accessories-fabric:1.1.0-beta.52+1.21.1"
    modImplementation "io.wispforest:owo-lib:0.12.15.4+1.21"
    modImplementation "io.wispforest:endec:0.1.8.1"
    modImplementation "io.wispforest.endec:netty:0.1.4"
    modImplementation "io.wispforest.endec:gson:0.1.5.1"
    modImplementation "maven.modrinth:SszvX85I:ch7DfnXP"
    modCompileOnly "maven.modrinth:placeholder-api:2.4.2+1.21"
    compileOnly "net.luckperms:api:5.4"
    modImplementation files('../SVFrameLib/build/libs/SVFrameLib-1.7.1-fabric.jar')
    modImplementation files('../SVFrameMMO/build/libs/SVFrameMMO-1.13.1-fabric.jar')
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
processResources { filesMatching('fabric.mod.json') { expand version: project.version } }

tasks.register('nativeIntegrationSmoke', JavaExec) {
    dependsOn classes
    group = 'verification'
    description = 'Runs native Cobblemon integration smoke checks on the Loom runtime classpath.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'vn.svframe.svframemmo.cobblemon.validation.NativeIntegrationSmoke'
}
