name: SVFrameMMO Cobblemon Integration Fabric 1.21.1
on:
  push:
    branches: [svframemmo-cobblemon-integration-1.21.1]
    paths: ['.github/workflows/svframemmo-cobblemon.yml', 'SVFrameMMOCobblemon/**']
  workflow_dispatch:
concurrency:
  group: svframemmo-cobblemon-integration-1.21.1
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svframemmo-cobblemon-integration-1.21.1
          fetch-depth: 1
      - name: Sync SVFrameLib
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframelib-fabric-1.21.1
          rm -rf SVFrameLib
          git checkout FETCH_HEAD -- SVFrameLib
      - name: Sync SVFrameMMO
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframemmo-fabric-1.21.1
          rm -rf SVFrameMMO
          git checkout FETCH_HEAD -- SVFrameMMO
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Ownership gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --binary-files=without-match -Ei 'svframeitems|fusion_tier' SVFrameMMOCobblemon/src SVFrameMMOCobblemon/build.gradle
          grep -q 'custom-model-data' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
          grep -q 'DataComponentTypes.CUSTOM_MODEL_DATA' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/item/PotaraTierResolver.java
          grep -q 'svframemmo-skill-source' SVFrameMMOCobblemon/src/main/resources/fabric.mod.json
          grep -q 'kyurem_black' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
          grep -q 'kyurem_white' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
          grep -q 'POTARA_FUSION_FORM_DELAY_TICKS = 88L' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/MegaShowdownEffects.java
      - name: Build SVFrameLib
        run: cd SVFrameLib && gradle --no-daemon clean test remapJar
      - name: Build SVFrameMMO
        run: cd SVFrameMMO && gradle --no-daemon clean test remapJar
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12.1' }
      - name: Build integration
        run: cd SVFrameMMOCobblemon && gradle --no-daemon --stacktrace clean test nativeIntegrationSmoke remapJar
      - name: Dedicated Integration Fabric boot
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMOCobblemon
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 120s gradle --no-daemon runServer > build/integration-server.log 2>&1
          status=$?
          set -e
          cat build/integration-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'Loading Minecraft 1.21.1 with Fabric Loader' build/integration-server.log
          grep -q 'SVFrameMMO Fabric online' build/integration-server.log
          grep -q 'Cobblemon Integration online' build/integration-server.log
          grep -q 'Done (' build/integration-server.log
          ! grep -q 'Mixin apply failed' build/integration-server.log
          ! grep -q 'Could not execute entrypoint stage' build/integration-server.log
          ! grep -Eq 'NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Exception in server tick loop' build/integration-server.log
      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameMMO-Cobblemon-Integration
          path: |
            SVFrameMMOCobblemon/build/libs/SVFrameMMO-Cobblemon-Integration-*.jar
            !SVFrameMMOCobblemon/build/libs/*sources*.jar
            SVFrameMMOCobblemon/build/integration-server.log
          if-no-files-found: error
          retention-days: 14
