name: SVFrameMMO Cobblemon Integration Fabric 1.21.1
on:
  push:
    branches: [svframemmo-cobblemon-integration-1.21.1]
    paths: ['.github/workflows/svframemmo-cobblemon.yml', 'SVFrameMMOCobblemon/**']
  workflow_dispatch:
concurrency:
  group: svframemmo-cobblemon-integration-1.21.1
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svframemmo-cobblemon-integration-1.21.1
          fetch-depth: 1
      - name: Sync SVFrameLib
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframelib-fabric-1.21.1
          rm -rf SVFrameLib
          git checkout FETCH_HEAD -- SVFrameLib
      - name: Sync SVFrameMMO
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframemmo-fabric-1.21.1
          rm -rf SVFrameMMO
          git checkout FETCH_HEAD -- SVFrameMMO
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.8' }
      - name: Ownership and architecture gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn --binary-files=without-match -Ei 'svframeitems|fusion_tier' SVFrameMMOCobblemon/src SVFrameMMOCobblemon/build.gradle
          ! grep -RIn --binary-files=without-match -Ei 'pocketmorph|com\.pixelpitstop|j3wTk6KL' SVFrameMMOCobblemon/src SVFrameMMOCobblemon/build.gradle
          grep -q 'maven.modrinth:SszvX85I:ch7DfnXP' SVFrameMMOCobblemon/build.gradle
          grep -q 'xyz.nucleoid:disguiselib-fabric:1.3.3' SVFrameMMOCobblemon/build.gradle
          grep -q 'include "xyz.nucleoid:disguiselib-fabric:1.3.3"' SVFrameMMOCobblemon/build.gradle
          grep -q 'svframemmo-skill-source' SVFrameMMOCobblemon/src/main/resources/fabric.mod.json
          grep -q '"disguiselib"' SVFrameMMOCobblemon/src/main/resources/fabric.mod.json
          ! grep -q '"client"' SVFrameMMOCobblemon/src/main/resources/fabric.mod.json
          ! grep -q '"mixins"' SVFrameMMOCobblemon/src/main/resources/fabric.mod.json
          grep -q 'EntityDisguise' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionVisualBridge.java
          grep -q 'disguise.disguiseAs(visual)' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionVisualBridge.java
          grep -q 'properties.createEntity(player.getServerWorld())' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionVisualBridge.java
          grep -q 'FusionVisualBridge.verifyBackend()' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/SVFrameMMOCobblemon.java
          test ! -e SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/client/SVFrameMMOCobblemonClient.java
          test ! -e SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/mixin/client/PlayerEntityRendererMixin.java
          test ! -e SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/render/ClientFusionMorphState.java
          test ! -e SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/render/FusionMorphNetworking.java
          test ! -e SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/render/FusionMorphPayload.java
          test ! -e SVFrameMMOCobblemon/src/main/resources/svframemmo_cobblemon.client.mixins.json
          ! grep -RIn --binary-files=without-match -E 'FusionMorphPayload|FusionMorphNetworking|ClientFusionMorphState|PlayerEntityRendererMixin' SVFrameMMOCobblemon/src
          grep -q 'FusionNetworkGuards.register(FUSIONS)' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/SVFrameMMOCobblemon.java
          grep -q 'unregisterGlobalReceiver' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionNetworkGuards.java
          grep -q 'move_party_pokemon_to_pc' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionNetworkGuards.java
          grep -q 'swap_pc_party_pokemon' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionNetworkGuards.java
          grep -q 'pasture_pokemon' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/FusionNetworkGuards.java
          grep -q 'SkillHandlerSource' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'SOURCE_KEY = "cobblemon"' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'Moves.all()' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'Moves.INSTANCE.getObservable()' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/SVFrameMMOCobblemon.java
          grep -q 'CobblemonMoveConfigGenerator.regenerate' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/SVFrameMMOCobblemon.java
          grep -q 'generated-moves' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveConfigGenerator.java
          grep -q 'COBBLEMON_CATEGORY_' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'COBBLEMON_EXECUTOR_' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'MOLANG_SOUND' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonActionEffectParser.java
          grep -q 'MOLANG_PARTICLE' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonActionEffectParser.java
          grep -q 'genericProfiles' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonMoveVfxService.java
          grep -q 'cobblemon:hit' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonMoveVfxService.java
          grep -q 'SVFrameMMO.externalSkills().replace' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'PlayerSkillCatalog.bindings' SVFrameMMO/src/main/java/vn/svframe/svframemmo/skill/runtime/SkillBarRuntime.java
          grep -q 'class SkillListGui' SVFrameMMO/src/main/java/vn/svframe/svframemmo/skill/gui/SkillListGui.java
          test ! -e SVFrameMMO/src/main/java/vn/svframe/svframemmo/skill/gui/ExternalSkillGui.java
          grep -q 'source: cobblemon:<move>' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonSkillSourceEntrypoint.java
          grep -q 'SVFrameMMO.reload()' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/SVFrameMMOCobblemon.java
          grep -q 'custom-model-data' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
          grep -q 'DataComponentTypes.CUSTOM_MODEL_DATA' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/item/PotaraTierResolver.java
          grep -q 'slot > 4' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java
          grep -q 'MegaShowdownEffects.playPotaraFusionStart' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/PotaraUseHandler.java
          grep -q 'PENDING_FUSIONS' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/PotaraUseHandler.java
          grep -q 'delayedActions().schedule' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/fusion/PotaraUseHandler.java
          grep -q 'Effect.getEffect' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/MegaShowdownEffects.java
          grep -q 'effect.applyEffects' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/MegaShowdownEffects.java
          grep -q 'apply_after' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/MegaShowdownEffects.java
          grep -q 'animation.applyDelay' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/MegaShowdownEffects.java
          grep -q 'UnvalidatedPlaySoundS2CPacket' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/integration/CobblemonMoveVfxService.java
          grep -q 'kyurem_black' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
          grep -q 'kyurem_white' SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/config/IntegrationConfig.java
      - name: Build SVFrameLib
        run: cd SVFrameLib && gradle --no-daemon clean test remapJar
      - name: Build SVFrameMMO
        run: cd SVFrameMMO && gradle --no-daemon clean test remapJar
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.0' }
      - name: Build integration
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMOCobblemon
          gradle --no-daemon --stacktrace clean test nativeIntegrationSmoke remapJar copyProductionRuntimeDeps
          integration_jar=$(find build/libs -maxdepth 1 -type f -name 'SVFrameMMO-Cobblemon-Integration-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$integration_jar"
          unzip -Z1 "$integration_jar" | grep -Eq '^META-INF/jars/.*disguiselib.*\.jar$'
      - name: Dedicated Integration Fabric production boot
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMOCobblemon
          ROOT="$PWD"
          SERVER="$ROOT/build/production-server"
          rm -rf "$SERVER"
          mkdir -p "$SERVER/mods" "$SERVER/extra-libs"

          for jar in "$ROOT"/build/production-runtime-deps/*.jar; do
            if unzip -Z1 "$jar" | grep -qx 'fabric.mod.json'; then
              cp "$jar" "$SERVER/mods/"
            else
              cp "$jar" "$SERVER/extra-libs/"
            fi
          done

          cp "$ROOT/../SVFrameLib/build/libs/SVFrameLib-1.7.1-fabric.jar" "$SERVER/mods/"
          cp "$ROOT/../SVFrameMMO/build/libs/SVFrameMMO-1.13.1-fabric.jar" "$SERVER/mods/"
          integration_jar=$(find "$ROOT/build/libs" -maxdepth 1 -type f -name 'SVFrameMMO-Cobblemon-Integration-*.jar' ! -name '*sources*' | head -n 1)
          test -n "$integration_jar"
          cp "$integration_jar" "$SERVER/mods/"

          curl -fsSL 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.0.3/fabric-installer-1.0.3.jar' -o "$SERVER/fabric-installer.jar"
          cd "$SERVER"
          java -jar fabric-installer.jar server -mcversion 1.21.1 -loader 0.18.4 -downloadMinecraft
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties

          java -Xms512M -Xmx2G -cp 'extra-libs/*:fabric-server-launch.jar' net.fabricmc.loader.impl.launch.server.FabricServerLauncher nogui > "$ROOT/build/integration-server.log" 2>&1 &
          server_pid=$!
          ready=0
          for _ in $(seq 1 150); do
            if grep -q 'Done (' "$ROOT/build/integration-server.log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill -TERM "$server_pid" 2>/dev/null || true
          set +e
          wait "$server_pid"
          status=$?
          set -e
          cat "$ROOT/build/integration-server.log"
          if [ "$ready" -ne 1 ]; then
            echo "Production server did not reach the Done state (exit=$status)" >&2
            exit 1
          fi
          grep -q 'Loading Minecraft 1.21.1 with Fabric Loader' "$ROOT/build/integration-server.log"
          grep -q 'SVFrameMMO Fabric online;' "$ROOT/build/integration-server.log"
          grep -Eq 'Cobblemon move provider synchronized; providerMoves=[1-9][0-9]*, registeredSkills=[1-9][0-9]*, generatedConfigs=[1-9][0-9]*' "$ROOT/build/integration-server.log"
          grep -q 'provider=cobblemon' "$ROOT/build/integration-server.log"
          grep -q 'fusionVisual=server-packet-disguise/disguiselib' "$ROOT/build/integration-server.log"
          grep -qi 'disguiselib' "$ROOT/build/integration-server.log"
          grep -q 'Fusion storage network guards installed' "$ROOT/build/integration-server.log"
          grep -q 'Staged 4 Snowstorm asset(s) / 3 particle id(s)' "$ROOT/build/integration-server.log"
          grep -q 'Done (' "$ROOT/build/integration-server.log"
          generated_dir="$SERVER/config/SVFrameMMOCobblemon/generated-moves"
          test -f "$generated_dir/_manifest.json"
          generated_count=$(find "$generated_dir" -maxdepth 1 -type f -name '*.json' ! -name '_manifest.json' | wc -l)
          test "$generated_count" -gt 900
          grep -q '"provider": "cobblemon"' "$generated_dir/_manifest.json"
          ! grep -qi 'pocketmorph' "$ROOT/build/integration-server.log"
          ! grep -q 'Could not execute entrypoint stage' "$ROOT/build/integration-server.log"
          ! grep -Eq 'MixinTargetAlreadyLoadedException|MixinApplyError|InvalidMixinException|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Exception in server tick loop|ProviderMismatchException' "$ROOT/build/integration-server.log"
      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameMMO-Cobblemon-Integration
          path: |
            SVFrameMMOCobblemon/build/libs/SVFrameMMO-Cobblemon-Integration-*.jar
            !SVFrameMMOCobblemon/build/libs/*sources*.jar
            SVFrameMMOCobblemon/build/integration-server.log
          if-no-files-found: error
          retention-days: 14
