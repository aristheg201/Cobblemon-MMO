name: Patch Alpha Animation API

on:
  push:
    branches: [ alpha-encounter-fabric-1.21.1 ]
    paths: [ '.github/workflows/patch-alpha-animation.yml' ]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-encounter-fabric-1.21.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Patch Cobblemon 1.8 animation signature
        run: |
          sed -i 's/entity\.playAnimation(animation);/entity.playAnimation(animation, java.util.List.of());/' src/main/java/dev/aristheg/alphaencounter/AlphaEncounterMod.java
          grep -n 'playAnimation(animation' src/main/java/dev/aristheg/alphaencounter/AlphaEncounterMod.java
      - name: Build
        run: gradle build --stacktrace
      - name: Remove one-shot workflow and commit validated patch
        run: |
          rm .github/workflows/patch-alpha-animation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/aristheg/alphaencounter/AlphaEncounterMod.java .github/workflows/patch-alpha-animation.yml
          git commit -m 'Fix Cobblemon 1.8 animation API and validate runtime'
          git push origin HEAD:alpha-encounter-fabric-1.21.1
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Encounter-validated
          path: build/libs/*.jar
