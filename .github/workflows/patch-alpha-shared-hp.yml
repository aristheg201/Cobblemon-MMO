name: Patch Alpha Shared HP Phases

on:
  push:
    branches:
      - alpha-encounter-fabric-1.21.1
    paths:
      - .github/workflows/patch-alpha-shared-hp.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-encounter-fabric-1.21.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Patch shared HP battle semantics
        run: python tools/patch_alpha_shared_hp.py
      - name: Build
        run: gradle build --stacktrace
      - name: Remove one-shot helpers and commit validated patch
        run: |
          rm .github/workflows/patch-alpha-shared-hp.yml
          rm tools/patch_alpha_shared_hp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/dev/aristheg/alphaencounter/AlphaEncounterMod.java .github/workflows/patch-alpha-shared-hp.yml tools/patch_alpha_shared_hp.py
          git commit -m 'Make shared HP multi-phase and battle-delta driven'
          git push origin HEAD:alpha-encounter-fabric-1.21.1
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Encounter-multiphase
          path: build/libs/*.jar
