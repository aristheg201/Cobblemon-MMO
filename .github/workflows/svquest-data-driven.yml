name: SVQuest guided campaign Fabric 1.21.1

on:
  push:
    branches:
      - svquest-data-driven-1.21.1
    paths:
      - 'SVQuest/**'
      - '.github/workflows/svquest-data-driven.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svquest-data-driven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout single SVQuest branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate linked campaign and reward budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('SVQuest/src/main/resources/defaults/svquest')
          files = sorted((root / 'quests').glob('*.json'))
          assert files, 'No quest data files'
          absolute = {'pokemon_level', 'trainer_level', 'skill_purchase', 'ranked_elo'}
          ids = set()
          total_count = 0
          cobble_total = 0.0
          beast_total = 0.0

          def check_objectives(objs, context):
              assert objs, f'quest without objectives: {context}'
              if all(str(o.get('key','')).startswith('feature.') for o in objs):
                  raise AssertionError(f'feature-only quest forbidden: {context}')
              for o in objs:
                  key = str(o.get('key',''))
                  assert key, f'missing objective key: {context}'
                  if key not in absolute:
                      assert o.get('resetOnClaim') is True, f'fresh objective must reset on claim: {context}/{key}'

          def check_grant(g, context, cycle=1):
              nonlocal_dummy = None
              amount = float(g.get('amountStart', g.get('amount', 0))) + (cycle - 1) * float(g.get('amountStep', 0))
              typ = str(g.get('type','')).lower()
              gid = str(g.get('id','')).lower()
              if typ == 'beconomy' and gid == 'huntercoin':
                  raise AssertionError(f'HunterCoin forbidden: {context}')
              return typ, gid, amount

          for p in files:
              raw = p.read_text(encoding='utf-8')
              assert 'huntercoin' not in raw.lower(), f'HunterCoin text forbidden in {p}'
              data = json.loads(raw)
              if data.get('catalogRoot') is not True:
                  continue
              file_count = 0
              assert int(data.get('managedVersion', 0)) >= 15, f'managedVersion missing in {p}'
              entries = data.get('entries', [])
              for entry in entries:
                  kind = entry.get('kind', 'quest')
                  if kind == 'quest':
                      file_count += 1
                      qid = entry['id']
                      assert qid not in ids, f'duplicate quest id {qid}'
                      ids.add(qid)
                      check_objectives(entry.get('objectives', []), qid)
                      for g in entry.get('grants', []):
                          typ, gid, amount = check_grant(g, qid)
                          if typ == 'cobbledollars' and amount > 0:
                              assert amount >= 500000, f'CobbleDollars below 500k: {qid}'
                              cobble_total += amount
                          if typ == 'beconomy' and gid == 'beastcoin' and amount > 0:
                              assert amount >= 10, f'BeastCoin below 10: {qid}'
                              beast_total += amount
                  elif kind == 'series':
                      count = int(entry.get('count', 0))
                      assert 1 <= count <= 10000
                      file_count += count
                      objs = entry.get('objectives') or ([entry['objective']] if entry.get('objective') else [])
                      check_objectives(objs, entry['idPrefix'])
                      for i in range(1, count + 1):
                          qid = f"{entry['idPrefix']}_{i:03d}"
                          assert qid not in ids
                          ids.add(qid)
                          for g in entry.get('grants', []):
                              typ, gid, amount = check_grant(g, qid, i)
                              if typ == 'cobbledollars' and amount > 0:
                                  assert amount >= 500000
                                  cobble_total += amount
                              if typ == 'beconomy' and gid == 'beastcoin' and amount > 0:
                                  assert amount >= 10
                                  beast_total += amount
                  elif kind == 'rotation':
                      cycles = int(entry.get('cycles', 0))
                      steps = entry.get('steps', [])
                      assert 1 <= cycles <= 1000 and len(steps) >= 20, 'rotation must be broad and varied'
                      file_count += cycles * len(steps)
                      for cycle in range(1, cycles + 1):
                          for step in steps:
                              sid = step['id']
                              qid = f"{entry['idPrefix']}_{cycle:02d}_{sid}"
                              assert qid not in ids, f'duplicate generated quest id {qid}'
                              ids.add(qid)
                              check_objectives(step.get('objectives', []), qid)
                              for g in step.get('grants', []):
                                  typ, gid, amount = check_grant(g, qid, cycle)
                                  if typ == 'cobbledollars' and amount > 0:
                                      assert amount >= 500000, f'CobbleDollars below 500k: {qid}'
                                      cobble_total += amount
                                  if typ == 'beconomy' and gid == 'beastcoin' and amount > 0:
                                      assert amount >= 10, f'BeastCoin below 10: {qid}'
                                      beast_total += amount
                  else:
                      raise AssertionError(f'unknown entry kind: {kind}')
              expected = data.get('expectedQuestCount')
              if expected is not None:
                  assert int(expected) == file_count, f'{p}: expected={expected}, expanded={file_count}'
              total_count += file_count

          json.loads((root/'settings.json').read_text(encoding='utf-8'))
          json.loads((root/'features.json').read_text(encoding='utf-8'))
          assert total_count >= 1000, f'Quest corpus too small: {total_count}'
          assert cobble_total <= 100_000_000, f'CobbleDollars budget too high: {cobble_total}'
          assert beast_total <= 500, f'BeastCoin budget too high: {beast_total}'
          assert round(cobble_total) == 97_500_000, f'Unexpected CobbleDollars budget: {cobble_total}'
          assert round(beast_total) == 350, f'Unexpected BeastCoin budget: {beast_total}'
          print('Expanded quest count:', total_count)
          print('CobbleDollars total:', int(cobble_total))
          print('BeastCoin total:', int(beast_total))
          print('HunterCoin total: 0')
          PY
          ! grep -R --line-number --include='*.java' 'switch *(quest\.id())' SVQuest/src/main/java
          ! grep -R --line-number --include='*.java' 'COMMANDS\.put' SVQuest/src/main/java
          ! grep -R --line-number --include='*.java' 'List\.of( *new Quest' SVQuest/src/main/java

      - name: Verify linked fresh-objective claim flow
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'resetOnClaim' SVQuest/src/main/java/vn/svframe/svquest/quest/QuestCatalog.java
          grep -q 'objective.resetOnClaim()' SVQuest/src/main/java/vn/svframe/svquest/server/QuestStateStore.java
          grep -q 'CHỜ NHẬN THƯỞNG' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'NHẬN THƯỞNG' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'action.equals("claim")' SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java
          grep -q 'externalProgression' SVQuest/src/main/java/vn/svframe/svquest/server/ReflectionIntegrationBridge.java

      - name: Verify client empty-catalog render safety
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QuestCatalog.QUESTS.isEmpty()' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'renderCatalogLoading' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java

      - name: Verify legacy feature-array compatibility is wired
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'root.isJsonArray()' SVQuest/src/main/java/vn/svframe/svquest/server/FeatureCatalog.java
          grep -q 'parseArray' SVQuest/src/main/java/vn/svframe/svquest/server/FeatureCatalog.java

      - name: Loom remap build
        working-directory: SVQuest
        run: gradle --no-daemon clean remapJar sourcesJar --stacktrace

      - name: Verify remapped artifact
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/quest/QuestCatalog.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/server/GuidedProgressBridge.class'
          unzip -l "$JAR" | grep -q 'defaults/svquest/quests/00-guided-campaign.json'
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest
          rm -rf run
          set +e
          timeout 90s xvfb-run -a gradle --no-daemon runClient > build/client-smoke.log 2>&1
          code=$?
          set -e
          cat build/client-smoke.log
          if grep -E -q "IncompatibleClassChangeError|Could not execute entrypoint stage 'client'|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Exception in thread \"Render thread\"" build/client-smoke.log; then exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Dedicated server smoke test with legacy config migration
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest
          rm -rf run
          mkdir -p run/config/svquest/quests
          printf 'eula=true\n' > run/eula.txt
          cat > run/config/svquest/features.json <<'JSON'
          [
            {"id":"pokemon_skills","command":"pokeskill"},
            {"featureId":"breeding","opener":"soulbreeding"}
          ]
          JSON
          cat > run/config/svquest/quests/00-guided-campaign.json <<'JSON'
          {"managedVersion":14,"catalogRoot":true,"entries":[{"kind":"quest","id":"legacy","title":"legacy","objectives":[{"key":"capture","label":"legacy","target":1}],"rewards":["1 HunterCoin"],"grants":[{"type":"beconomy","id":"huntercoin","amount":1}]}]}
          JSON
          set +e
          timeout 75s gradle --no-daemon runServer > build/server-smoke.log 2>&1
          code=$?
          set -e
          cat build/server-smoke.log
          if grep -E -q "Could not execute entrypoint stage 'server'|Could not execute entrypoint stage 'main'|IncompatibleClassChangeError|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Encountered an unexpected exception|ClassCastException" build/server-smoke.log; then exit 1; fi
          grep -q 'SVQuest loaded 1030 quests' build/server-smoke.log
          grep -q 'HunterCoin=0' build/server-smoke.log
          grep -q '"managedVersion": 15' run/config/svquest/quests/00-guided-campaign.json
          ! grep -qi 'huntercoin' run/config/svquest/quests/00-guided-campaign.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVQuest-beta.15-linked-campaign
          path: |
            SVQuest/build/libs/SVQuest-*.jar
            SVQuest/build/libs/SHA256.txt
            SVQuest/build/libs/fabric.mod.built.json
            SVQuest/build/client-smoke.log
            SVQuest/build/server-smoke.log
          if-no-files-found: error
