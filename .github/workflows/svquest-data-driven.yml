name: SVQuest guided campaign Fabric 1.21.1

on:
  push:
    branches: [svquest-data-driven-1.21.1]
    paths:
      - 'SVQuest/**'
      - '.github/workflows/svquest-data-driven.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svquest-data-driven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout single SVQuest branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate linked campaign and reward budgets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('SVQuest/src/main/resources/defaults/svquest')
          files = sorted((root / 'quests').glob('*.json'))
          assert files, 'No quest data files'
          absolute = {'pokemon_level', 'trainer_level', 'skill_purchase', 'skill_bound', 'ranked_elo'}
          ids=set(); total=0; cobble=0.0; beast=0.0

          def objectives(objs, ctx):
              assert objs, f'quest without objectives: {ctx}'
              assert not all(str(o.get('key','')).startswith('feature.') for o in objs), f'feature-only quest forbidden: {ctx}'
              for o in objs:
                  key=str(o.get('key',''))
                  assert key, f'missing objective key: {ctx}'
                  if key not in absolute:
                      assert o.get('resetOnClaim') is True, f'fresh objective must reset on claim: {ctx}/{key}'

          def reward(g, ctx, cycle=1):
              nonlocal_placeholder=None
              typ=str(g.get('type','')).lower(); gid=str(g.get('id','')).lower()
              amount=float(g.get('amountStart',g.get('amount',0)))+(cycle-1)*float(g.get('amountStep',0))
              assert not (typ=='beconomy' and gid=='huntercoin'), f'HunterCoin reward forbidden: {ctx}'
              if typ=='cobbledollars' and amount>0:
                  assert amount>=500000, f'CobbleDollars below 500k: {ctx}'
              if typ=='beconomy' and gid=='beastcoin' and amount>0:
                  assert amount>=10, f'BeastCoin below 10: {ctx}'
              return typ,gid,amount

          roots=[]
          for p in files:
              data=json.loads(p.read_text(encoding='utf-8'))
              if data.get('catalogRoot') is True: roots.append((p,data))
          assert roots, 'No catalogRoot quest file'

          for p,data in roots:
              assert int(data.get('managedVersion',0))>=16, f'managedVersion missing: {p}'
              count=0
              for e in data.get('entries',[]):
                  kind=e.get('kind','quest')
                  if kind=='quest':
                      count+=1; q=e['id']; assert q not in ids; ids.add(q); objectives(e.get('objectives',[]),q)
                      for display in e.get('rewards',[]): assert 'huntercoin' not in display.lower(), f'HunterCoin display reward forbidden: {q}'
                      for g in e.get('grants',[]):
                          typ,gid,amt=reward(g,q)
                          if typ=='cobbledollars': cobble+=amt
                          if typ=='beconomy' and gid=='beastcoin': beast+=amt
                  elif kind=='series':
                      n=int(e.get('count',0)); assert 1<=n<=10000; count+=n
                      objs=e.get('objectives') or ([e['objective']] if e.get('objective') else []); objectives(objs,e['idPrefix'])
                      for i in range(1,n+1):
                          q=f"{e['idPrefix']}_{i:03d}"; assert q not in ids; ids.add(q)
                          for display in e.get('rewards',[]): assert 'huntercoin' not in display.lower(), f'HunterCoin display reward forbidden: {q}'
                          for g in e.get('grants',[]):
                              typ,gid,amt=reward(g,q,i)
                              if typ=='cobbledollars': cobble+=amt
                              if typ=='beconomy' and gid=='beastcoin': beast+=amt
                  elif kind=='rotation':
                      cycles=int(e.get('cycles',0)); steps=e.get('steps',[])
                      assert 1<=cycles<=1000 and len(steps)>=20, 'rotation must be broad and varied'
                      count+=cycles*len(steps)
                      for cycle in range(1,cycles+1):
                          for step in steps:
                              q=f"{e['idPrefix']}_{cycle:02d}_{step['id']}"; assert q not in ids; ids.add(q); objectives(step.get('objectives',[]),q)
                              for display in step.get('rewards',[]): assert 'huntercoin' not in display.lower(), f'HunterCoin display reward forbidden: {q}'
                              for g in step.get('grants',[]):
                                  typ,gid,amt=reward(g,q,cycle)
                                  if typ=='cobbledollars': cobble+=amt
                                  if typ=='beconomy' and gid=='beastcoin': beast+=amt
                  else: raise AssertionError(f'unknown entry kind: {kind}')
              assert int(data.get('expectedQuestCount',count))==count, f'{p}: expected/count mismatch'
              total+=count

          json.loads((root/'settings.json').read_text(encoding='utf-8'))
          json.loads((root/'features.json').read_text(encoding='utf-8'))
          assert total==1030, f'Expected 1030 quests, got {total}'
          assert round(cobble)==97_500_000 and cobble<=100_000_000, f'CobbleDollars budget={cobble}'
          assert round(beast)==350 and beast<=500, f'BeastCoin budget={beast}'
          print('Expanded quest count:',total)
          print('CobbleDollars total:',int(cobble))
          print('BeastCoin total:',int(beast))
          print('HunterCoin reward total: 0')
          PY
          ! grep -R --line-number --include='*.java' 'switch *(quest\.id())' SVQuest/src/main/java
          ! grep -R --line-number --include='*.java' 'COMMANDS\.put' SVQuest/src/main/java
          ! grep -R --line-number --include='*.java' 'List\.of( *new Quest' SVQuest/src/main/java

      - name: Verify linked fresh-objective claim flow
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'resetOnClaim' SVQuest/src/main/java/vn/svframe/svquest/quest/QuestCatalog.java
          grep -q 'objective.resetOnClaim()' SVQuest/src/main/java/vn/svframe/svquest/server/QuestStateStore.java
          grep -q 'NHẬN THƯỞNG' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'action.equals("claim")' SVQuest/src/main/java/vn/svframe/svquest/server/ServerRuntime.java
          BRIDGE=SVQuest/src/main/java/vn/svframe/svquest/server/ReflectionIntegrationBridge.java
          grep -q 'getMethod("learned", UUID.class)' "$BRIDGE"
          grep -q 'getMethod("bindings", UUID.class)' "$BRIDGE"
          grep -q 'engine.metric(player, "skill_purchase", learned)' "$BRIDGE"
          grep -q 'engine.metric(player, "skill_bound", bindings.size())' "$BRIDGE"
          grep -q 'engine.signal(player, "skill_bind")' "$BRIDGE"
          ! grep -q 'getSkillBindings' "$BRIDGE"

      - name: Verify canonical SVFrameMMO Pokemon-skill API contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframemmo-fabric-1.21.1:refs/remotes/origin/svframemmo-fabric-1.21.1
          git fetch --no-tags --depth=1 origin svframemmo-cobblemon-integration-1.21.1:refs/remotes/origin/svframemmo-cobblemon-integration-1.21.1
          git show origin/svframemmo-fabric-1.21.1:SVFrameMMO/src/main/java/vn/svframe/svframemmo/skill/ExternalSkillProgression.java > /tmp/ExternalSkillProgression.java
          grep -q 'Map<String, Integer> learned(UUID playerId)' /tmp/ExternalSkillProgression.java
          grep -q 'Map<Integer, String> bindings(UUID playerId)' /tmp/ExternalSkillProgression.java
          git show origin/svframemmo-cobblemon-integration-1.21.1:SVFrameMMOCobblemon/src/main/java/vn/svframe/svframemmo/cobblemon/move/CobblemonMoveSkillAdapter.java > /tmp/CobblemonMoveSkillAdapter.java
          grep -q 'Map<String, ClassSkill> definitions()' /tmp/CobblemonMoveSkillAdapter.java

      - name: Verify client and config compatibility guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QuestCatalog.QUESTS.isEmpty()' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'renderCatalogLoading' SVQuest/src/main/java/vn/svframe/svquest/client/QuestScreen.java
          grep -q 'root.isJsonArray()' SVQuest/src/main/java/vn/svframe/svquest/server/FeatureCatalog.java
          grep -q 'parseArray' SVQuest/src/main/java/vn/svframe/svquest/server/FeatureCatalog.java

      - name: Loom remap build
        working-directory: SVQuest
        run: gradle --no-daemon clean remapJar sourcesJar --stacktrace

      - name: Verify remapped artifact
        shell: bash
        run: |
          set -euo pipefail
          cd SVQuest
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVQuest-*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          unzip -p "$JAR" fabric.mod.json | tee build/libs/fabric.mod.built.json
          unzip -l "$JAR" | grep -q 'vn/svframe/svquest/quest/QuestCatalog.class'
          unzip -l "$JAR" | grep -q 'defaults/svquest/quests/00-guided-campaign.json'
          sha256sum "$JAR" | tee build/libs/SHA256.txt

      - name: Install virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Client startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest; rm -rf run
          set +e
          timeout 90s xvfb-run -a gradle --no-daemon runClient > build/client-smoke.log 2>&1
          code=$?; set -e; cat build/client-smoke.log
          if grep -E -q "IncompatibleClassChangeError|Could not execute entrypoint stage 'client'|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Exception in thread \"Render thread\"" build/client-smoke.log; then exit 1; fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Dedicated server smoke test with legacy config migration
        shell: bash
        run: |
          set -uo pipefail
          cd SVQuest; rm -rf run; mkdir -p run/config/svquest/quests; printf 'eula=true\n' > run/eula.txt
          cat > run/config/svquest/features.json <<'JSON'
          [{"id":"pokemon_skills","command":"pokeskill"},{"featureId":"breeding","opener":"soulbreeding"}]
          JSON
          cat > run/config/svquest/quests/00-guided-campaign.json <<'JSON'
          {"managedVersion":15,"catalogRoot":true,"entries":[{"kind":"quest","id":"legacy","title":"legacy","objectives":[{"key":"capture","label":"legacy","target":1}],"rewards":["1 HunterCoin"],"grants":[{"type":"beconomy","id":"huntercoin","amount":1}]}]}
          JSON
          set +e
          timeout 75s gradle --no-daemon runServer > build/server-smoke.log 2>&1
          code=$?; set -e; cat build/server-smoke.log
          if grep -E -q "Could not execute entrypoint stage 'server'|Could not execute entrypoint stage 'main'|IncompatibleClassChangeError|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Mixin apply failed|Encountered an unexpected exception|ClassCastException" build/server-smoke.log; then exit 1; fi
          grep -q 'SVQuest loaded 1030 quests' build/server-smoke.log
          grep -q 'HunterCoin=0' build/server-smoke.log
          grep -q '"managedVersion": 16' run/config/svquest/quests/00-guided-campaign.json
          grep -q '"key": "skill_bound"' run/config/svquest/quests/00-guided-campaign.json
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVQuest-beta.17-skill-progress
          path: |
            SVQuest/build/libs/SVQuest-*.jar
            SVQuest/build/libs/SHA256.txt
            SVQuest/build/libs/fabric.mod.built.json
            SVQuest/build/client-smoke.log
            SVQuest/build/server-smoke.log
          if-no-files-found: error
