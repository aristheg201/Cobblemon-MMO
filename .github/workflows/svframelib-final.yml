name: SVFrameLib Fabric 1.21.1 Full Parity

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib-final.yml'
      - 'SVFrameLib/**'
      - 'svframelib-bootstrap/full-parity-overlay.b64'
      - 'svframelib-bootstrap/svframelib-functional-required-classes.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout SVFrameLib branch
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply full functional parity source batch
        shell: bash
        run: |
          set -euo pipefail
          test -s svframelib-bootstrap/full-parity-overlay.b64
          base64 -d svframelib-bootstrap/full-parity-overlay.b64 > /tmp/svframelib-full-parity.tar.xz
          echo '0cee21d0f0a782101de46f5668f89db0337b93be2100074b8c405dbd1b241f96  /tmp/svframelib-full-parity.tar.xz' | sha256sum -c -
          tar -xJf /tmp/svframelib-full-parity.tar.xz -C .
          rm -f svframelib-bootstrap/full-parity-overlay.b64 svframelib-bootstrap/full-parity-part*
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/crunch/Crunch.java
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/script/targeter/entity/NearbyEntitiesTargeter.java
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/script/mechanic/shaped/ProjectileMechanic.java
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/damage/mitigation/MitigationModule.java
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/data/json/JSONFlatDatabase.java
          test -f SVFrameLib/src/main/java/vn/svframe/svframelib/anvilgui/AnvilGUI.java
          if grep -RIn --binary-files=without-match -E 'io[.]lumine[.]mythic[.]lib|io/lumine/mythic/lib' SVFrameLib/src/main; then
            echo 'Legacy io.lumine MythicLib namespace remains' >&2
            exit 1
          fi
          if grep -RIn --binary-files=without-match -Ei 'mythicmobs|mythicmobsfabric|castMythicMobs' SVFrameLib/src/main; then
            echo 'MythicMobs integration remains in active SVFrameLib source' >&2
            exit 1
          fi
          if grep -RIn --binary-files=without-match 'org[.]bukkit' SVFrameLib/src/main; then
            echo 'Bukkit runtime dependency remains in active SVFrameLib source' >&2
            exit 1
          fi
          grep -q '"fabricloader": ">=0.18.4"' SVFrameLib/src/main/resources/fabric.mod.json
          grep -q '"minecraft": "~1.21.1"' SVFrameLib/src/main/resources/fabric.mod.json

      - name: Full tests, Loom build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          gradle --no-daemon --stacktrace clean test remapJar

      - name: Verify full functional class surface
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "svframelib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"fabricloader": ">=0.18.4"'
          jar tf "$JAR" > /tmp/svframelib-jar-entries.txt
          missing=0
          total=0
          while IFS= read -r cls; do
            [ -z "$cls" ] && continue
            total=$((total+1))
            if ! grep -Fxq "${cls}.class" /tmp/svframelib-jar-entries.txt; then
              echo "Missing functional parity class: ${cls}.class" >&2
              missing=$((missing+1))
            fi
          done < svframelib-bootstrap/svframelib-functional-required-classes.txt
          echo "Functional class gate: total=$total missing=$missing"
          test "$total" -ge 800
          test "$missing" -eq 0
          grep -Fxq 'vn/svframe/svframelib/crunch/Crunch.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/comp/adventure/gradient/GradientBuilder.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/script/targeter/entity/ConeTargeter.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/script/targeter/location/CircleLocationTargeter.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/script/mechanic/shaped/RayTraceMechanic.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/damage/indicator/DamageIndicators.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/damage/mitigation/MitigationModule.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/damage/onhit/OnHitModule.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/data/queue/DataLoadQueue.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/data/json/JSONFlatDatabase.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/anvilgui/AnvilGUI.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/util/input/ChatPlayerInput.class' /tmp/svframelib-jar-entries.txt
          if grep -q '^io/lumine/mythic/lib/' /tmp/svframelib-jar-entries.txt; then exit 1; fi
          if grep -iEq 'mythicmobs|mythicmobsfabric' /tmp/svframelib-jar-entries.txt; then exit 1; fi
          sha256sum "$JAR" | tee SVFrameLib/build/SVFrameLib-SHA256.txt

      - name: Dedicated Fabric server boot and behavior gate
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'SVFrameLib functional parity online' build/svframelib-server.log
          grep -Eq 'SVFrameLib online|MythicLib Fabric online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log
          ! grep -q 'NoClassDefFoundError' build/svframelib-server.log
          ! grep -q 'NoSuchMethodError' build/svframelib-server.log
          ! grep -q 'NoSuchFieldError' build/svframelib-server.log

      - name: Commit full parity source and publish validated JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SVFrameLib/dist
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/dist/server-boot.log
          rm -rf SVFrameLib/build SVFrameLib/run SVFrameLib/.gradle
          git config user.name 'SVFrameLib Parity Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A SVFrameLib svframelib-bootstrap
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib: full native MythicLib 1.7.1 functional parity for Fabric 1.21.1 [skip ci]'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi

      - name: Upload validated full parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-1.7.1-fabric-full-parity
          path: |
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
            SVFrameLib/dist/server-boot.log
          if-no-files-found: error
          retention-days: 14
