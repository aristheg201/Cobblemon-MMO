name: SVFrameLib Fabric 1.21.1 Final

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib-final.yml'
      - 'svframelib-bootstrap/native-final-overlay-part*'
      - 'svframelib-bootstrap/svframelib-required-classes.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout final SVFrameLib branch
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Apply audited native final overlay
        shell: bash
        run: |
          set -euo pipefail
          cat svframelib-bootstrap/native-final-overlay-part* | base64 -d > /tmp/svframelib-native-final.tar.gz
          echo '5bdcb85d04cc59fd9bc459f5005e87f4b104d4ccdf572044b18e3991b8adb7bc  /tmp/svframelib-native-final.tar.gz' | sha256sum -c -
          tar -xzf /tmp/svframelib-native-final.tar.gz -C .
          test -f SVFrameLib/src/main/java/io/lumine/mythic/lib/MythicLib.java
          test -f SVFrameLib/src/main/java/io/lumine/mythic/lib/script/variable/def/AttributesVariable.java
          test -f SVFrameLib/src/main/java/io/lumine/mythic/lib/data/SynchronizedDataManager.java

      - name: Full tests, Loom build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          gradle --no-daemon --stacktrace clean test remapJar

      - name: Verify complete compatibility surface
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "svframelib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"name": "SVFrameLib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "1.7.1-fabric"'
          jar tf "$JAR" > /tmp/svframelib-jar-entries.txt
          missing=0
          while IFS= read -r cls; do
            [ -z "$cls" ] && continue
            if ! grep -Fxq "${cls}.class" /tmp/svframelib-jar-entries.txt; then
              echo "Missing required compatibility class: ${cls}.class" >&2
              missing=1
            fi
          done < svframelib-bootstrap/svframelib-required-classes.txt
          test "$missing" -eq 0
          grep -Fxq 'io/lumine/mythic/lib/script/variable/def/AttributesVariable.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'io/lumine/mythic/lib/util/Position.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'io/lumine/mythic/lib/data/SynchronizedDataManager.class' /tmp/svframelib-jar-entries.txt
          sha256sum "$JAR" | tee SVFrameLib/build/SVFrameLib-SHA256.txt

      - name: Dedicated Fabric server boot gate
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -Eq 'SVFrameLib online|MythicLib Fabric online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log
          ! grep -q 'NoClassDefFoundError' build/svframelib-server.log
          ! grep -q 'NoSuchMethodError' build/svframelib-server.log

      - name: Publish audited source and validated JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SVFrameLib/dist
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/dist/server-boot.log
          rm -rf SVFrameLib/build SVFrameLib/run SVFrameLib/.gradle
          git config user.name 'SVFrameLib Final Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add SVFrameLib
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib 1.7.1 Fabric: final native compatibility and validated JAR [skip ci]'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-1.7.1-fabric-final
          path: |
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
            SVFrameLib/dist/server-boot.log
          if-no-files-found: error
          retention-days: 14
