name: SVFrameLib Fabric 1.21.1 Native Parity

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib-final.yml'
      - 'SVFrameLib/**'
      - 'svframelib-bootstrap/svframelib-required-classes.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout SVFrameLib branch
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Native source integrity gates
        shell: bash
        run: |
          set -euo pipefail
          SRC=SVFrameLib/src/main
          PLATFORM="$SRC/java/vn/svframe/mythiclibfabric/runtime/script/ScriptPlatform.java"
          ENGINE="$SRC/java/vn/svframe/mythiclibfabric/runtime/script/ScriptEngine.java"
          DUMMY="$SRC/java/vn/svframe/svframelib/rpg/provided/DummyModule.java"

          test -f "$PLATFORM"
          test -f "$ENGINE"
          test -f "$DUMMY"
          grep -q '"fabricloader": ">=0.18.4"' "$SRC/resources/fabric.mod.json"
          grep -q '"minecraft": "~1.21.1"' "$SRC/resources/fabric.mod.json"

          if grep -RIn --binary-files=without-match -E 'io[.]lumine[.]mythic[.]lib|io/lumine/mythic/lib' "$SRC"; then
            echo 'Legacy io.lumine MythicLib namespace remains in active source' >&2
            exit 1
          fi
          if grep -RIn --binary-files=without-match -Ei 'mythicmobs|mythicmobsfabric|castMythicMobs' "$SRC"; then
            echo 'MythicMobs integration remains in active source' >&2
            exit 1
          fi
          if grep -RIn --binary-files=without-match 'org[.]bukkit' "$SRC"; then
            echo 'Bukkit runtime dependency remains in active source' >&2
            exit 1
          fi

          if grep -Eq 'default[[:space:]]+(void|boolean|Vector3|Collection<)' "$PLATFORM"; then
            echo 'ScriptPlatform contains a silent default operation' >&2
            exit 1
          fi
          if grep -Fq 'default -> true;' "$ENGINE" || grep -Fq 'default -> { }' "$ENGINE"; then
            echo 'ScriptEngine still silently accepts unknown conditions/mechanics' >&2
            exit 1
          fi
          grep -q 'experienceLevel' "$DUMMY"
          grep -q 'getHungerManager().setFoodLevel' "$DUMMY"
          grep -q 'getHungerManager().getFoodLevel' "$DUMMY"

      - name: Full tests, Loom build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          gradle --no-daemon --stacktrace clean test remapJar 2>&1 | tee build-parity.log

      - name: Verify compatibility surface and JAR namespace
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          jar tf "$JAR" > /tmp/svframelib-jar-entries.txt
          missing=0
          required=0
          while IFS= read -r cls; do
            [ -z "$cls" ] && continue
            required=$((required + 1))
            if ! grep -Fxq "${cls}.class" /tmp/svframelib-jar-entries.txt; then
              echo "Missing required compatibility class: ${cls}.class" >&2
              missing=$((missing + 1))
            fi
          done < svframelib-bootstrap/svframelib-required-classes.txt
          echo "Compatibility surface: required=$required missing=$missing"
          test "$required" -gt 0
          test "$missing" -eq 0
          ! grep -q '^io/lumine/mythic/lib/' /tmp/svframelib-jar-entries.txt
          ! grep -iEq 'mythicmobs|mythicmobsfabric' /tmp/svframelib-jar-entries.txt
          sha256sum "$JAR" | tee SVFrameLib/build/SVFrameLib-SHA256.txt

      - name: Dedicated Fabric server boot gate
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -Eq 'SVFrameLib online|MythicLib Fabric online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log
          ! grep -q 'NoClassDefFoundError' build/svframelib-server.log
          ! grep -q 'NoSuchMethodError' build/svframelib-server.log
          ! grep -q 'NoSuchFieldError' build/svframelib-server.log

      - name: Stage validated artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SVFrameLib/validated
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/validated/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/validated/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/validated/server-boot.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-native-parity-validation
          path: |
            SVFrameLib/validated
            SVFrameLib/build-parity.log
            SVFrameLib/build/svframelib-server.log
          if-no-files-found: warn
          retention-days: 14
