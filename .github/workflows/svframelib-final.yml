name: SVFrameLib Fabric 1.21.1

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib-final.yml'
      - 'SVFrameLib/**'
      - 'svframelib-bootstrap/svframelib-required-classes.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SVFrameLib branch
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Migrate legacy namespace and remove MythicMobs integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          repo = Path('.')
          java_root = repo / 'SVFrameLib' / 'src' / 'main' / 'java'
          old_parts = ['io', 'lumine', 'mythic', 'lib']
          new_parts = ['vn', 'svframe', 'svframelib']
          old_dot = '.'.join(old_parts)
          new_dot = '.'.join(new_parts)
          old_slash = '/'.join(old_parts)
          new_slash = '/'.join(new_parts)
          old_dir = java_root.joinpath(*old_parts)
          new_dir = java_root.joinpath(*new_parts)

          if old_dir.exists():
              new_dir.mkdir(parents=True, exist_ok=True)
              for src in sorted(old_dir.rglob('*')):
                  if not src.is_file():
                      continue
                  rel = src.relative_to(old_dir)
                  dst = new_dir / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if dst.exists():
                      raise RuntimeError(f'namespace collision: {dst}')
                  shutil.move(str(src), str(dst))
              shutil.rmtree(java_root / 'io', ignore_errors=True)

          bootstrap = repo / 'svframelib-bootstrap'
          if bootstrap.exists():
              for pattern in ('native-final-overlay-part*', 'loom-generic-fix.b64'):
                  for path in bootstrap.glob(pattern):
                      path.unlink()
          stale_source_archive = repo / 'SVFrameLib-source.tar.gz'
          if stale_source_archive.exists():
              stale_source_archive.unlink()

          skip_dirs = {'.git', '.gradle', 'build', 'run'}
          for path in repo.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() in {'.jar', '.zip', '.gz', '.png', '.jpg', '.jpeg', '.webp', '.class'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              replaced = text.replace(old_dot, new_dot).replace(old_slash, new_slash)
              if replaced != text:
                  path.write_text(replaced, encoding='utf-8')

          # Temporarily remove MythicMobs-specific adapters and fixtures.
          for rel in (
              ('vn','svframe','svframelib','skill','handler','MythicMobsSkillHandler.java'),
              ('vn','svframe','svframelib','skill','result','MythicMobsSkillResult.java'),
          ):
              path = java_root.joinpath(*rel)
              if path.exists():
                  path.unlink()

          smoke = java_root / 'vn' / 'svframe' / 'mythiclibfabric' / 'runtime' / 'MythicLibRuntimeSmoke.java'
          if smoke.exists():
              text = smoke.read_text(encoding='utf-8')
              text = text.replace('source: mythicmobs:TEST_WRAP', 'source: script:TEST_WRAP')
              smoke.write_text(text, encoding='utf-8')

          runtime = repo / 'SVFrameLib' / 'src' / 'main' / 'java' / 'vn' / 'svframe' / 'mythiclibfabric' / 'MythicLibFabricMod.java'
          if runtime.exists():
              text = runtime.read_text(encoding='utf-8')
              text = text.replace('import java.lang.reflect.Method;\n', '')
              text = text.replace('case "mythicmobs","mythic"->castMythicMobs(sourceId,caster,target,parameters);', '')
              start = text.find('    private static boolean castMythicMobs(')
              if start >= 0:
                  end = text.find('    private static ScriptContext context(', start)
                  if end < 0:
                      raise RuntimeError('could not locate end of MythicMobs integration block')
                  text = text[:start] + text[end:]
              runtime.write_text(text, encoding='utf-8')
          PY

          test -d SVFrameLib/src/main/java/vn/svframe/svframelib
          test ! -e SVFrameLib/src/main/java/io/lumine/mythic/lib
          if grep -RIn --binary-files=without-match -E 'io[.]lumine[.]mythic[.]lib|io/lumine/mythic/lib' \
              SVFrameLib svframelib-bootstrap .github --exclude='*.jar' --exclude='*.zip' --exclude='*.gz'; then
            echo 'Legacy MythicLib namespace remains after migration' >&2
            exit 1
          fi
          if grep -RIn --binary-files=without-match -Ei 'mythicmobs|mythicmobsfabric|castMythicMobs' SVFrameLib/src/main; then
            echo 'MythicMobs integration remains in active SVFrameLib source' >&2
            exit 1
          fi
          grep -q '"fabricloader": ">=0.18.4"' SVFrameLib/src/main/resources/fabric.mod.json
          grep -q '"minecraft": "~1.21.1"' SVFrameLib/src/main/resources/fabric.mod.json

      - name: Full tests, Loom build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          gradle --no-daemon --stacktrace clean test remapJar

      - name: Verify SVFrameLib namespace surface
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "svframelib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"name": "SVFrameLib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"fabricloader": ">=0.18.4"'
          jar tf "$JAR" > /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/MythicLib.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/api/player/MMOPlayerData.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/manager/SkillManager.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/script/variable/def/AttributesVariable.class' /tmp/svframelib-jar-entries.txt
          grep -Fxq 'vn/svframe/svframelib/data/SynchronizedDataManager.class' /tmp/svframelib-jar-entries.txt
          if grep -q '^io/lumine/mythic/lib/' /tmp/svframelib-jar-entries.txt; then
            echo 'Legacy package classes remain in remapped JAR' >&2
            exit 1
          fi
          if grep -iEq 'mythicmobs|mythicmobsfabric' /tmp/svframelib-jar-entries.txt; then
            echo 'MythicMobs classes/integration remain in remapped JAR' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee SVFrameLib/build/SVFrameLib-SHA256.txt

      - name: Dedicated Fabric server boot gate
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -Eq 'SVFrameLib online|MythicLib Fabric online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log
          ! grep -q 'NoClassDefFoundError' build/svframelib-server.log
          ! grep -q 'NoSuchMethodError' build/svframelib-server.log

      - name: Commit migrated source and publish validated JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SVFrameLib/dist
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/dist/server-boot.log
          rm -rf SVFrameLib/build SVFrameLib/run SVFrameLib/.gradle
          git config user.name 'SVFrameLib Namespace Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A SVFrameLib svframelib-bootstrap
          git add -A -- SVFrameLib-source.tar.gz 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib: migrate API namespace to vn.svframe.svframelib and remove MythicMobs [skip ci]'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi

      - name: Upload validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-1.7.1-fabric-namespace-migrated
          path: |
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
            SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
            SVFrameLib/dist/server-boot.log
          if-no-files-found: error
          retention-days: 14
