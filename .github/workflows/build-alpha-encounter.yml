name: Build Alpha-Encounter

on:
  push:
    branches: [ alpha-encounter-fabric-1.21.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Apply integration refactor
        if: ${{ hashFiles('tools/patch_alpha_integrations.py') != '' }}
        run: |
          python tools/patch_alpha_integrations.py
          rm tools/patch_alpha_integrations.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refactor Alpha encounter integrations [skip ci]"
          git push
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Encounter
          path: build/libs/*.jar
