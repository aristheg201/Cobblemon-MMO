name: Package Latest Validated Three JARs ZIP Fast

on:
  push:
    branches: [svframemmo-cobblemon-integration-1.21.1]
    paths: ['.github/workflows/package-three-jars-zip-fast.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svframemmo-cobblemon-integration-1.21.1
          fetch-depth: 1

      - name: Fetch latest validated Lib and MMO jars
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframelib-fabric-1.21.1
          LIB_SHA=$(git rev-parse FETCH_HEAD)
          git checkout FETCH_HEAD -- SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar

          git fetch --no-tags --depth=1 origin svframemmo-fabric-1.21.1
          MMO_SHA=$(git rev-parse FETCH_HEAD)
          git checkout FETCH_HEAD -- SVFrameMMO/validated/SVFrameMMO-1.13.1-fabric.jar

          echo "LIB_SHA=$LIB_SHA" >> "$GITHUB_ENV"
          echo "MMO_SHA=$MMO_SHA" >> "$GITHUB_ENV"

      - name: Stage three validated jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          cp SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar package/
          cp SVFrameMMO/validated/SVFrameMMO-1.13.1-fabric.jar package/
          cp SVFrameMMOCobblemon/validated/SVFrameMMO-Cobblemon-Integration-0.1.15.jar package/
          (cd package && sha256sum *.jar > SHA256.txt)
          printf 'SVFrameLib branch: %s\nSVFrameMMO branch: %s\nIntegration branch: %s\n' "$LIB_SHA" "$MMO_SHA" "$GITHUB_SHA" > package/COMMITS.txt
          test "$(find package -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 3
          ls -lh package

      - name: Upload direct 3-JAR archive
        uses: actions/upload-artifact@v4
        with:
          name: SVFrame-3-JARs-latest
          path: |
            package/*.jar
            package/SHA256.txt
            package/COMMITS.txt
          if-no-files-found: error
          retention-days: 14
