name: SVFrameLib Fabric 1.21.1

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib.yml'
      - 'SVFrameLib/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SVFrameLib source
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          path: target
      - name: Checkout Mod-dev source seed
        uses: actions/checkout@v4
        with:
          repository: aristheg201/Mod-dev
          ref: feature/fabric-mmo-ports
          path: moddev
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore all canonical MythicLib source overlays
        shell: bash
        run: |
          set -euo pipefail
          rm -rf seed overlays && mkdir -p seed overlays
          cat moddev/fabric-mmo-ports/bootstrap-m0.8/chunks/part* | base64 -d > seed.tar.gz
          echo '99f090bc86fe3e57215e009d55ff3eadf7582cf1418d98052a978922872fa75c  seed.tar.gz' | sha256sum -c -
          tar -xzf seed.tar.gz -C seed
          mkdir -p target/SVFrameLib/src/main/java target/SVFrameLib/src/main/resources
          for src in seed/mythiclib-runtime/src/main/java seed/common-runtime/src/main/java seed/fabric-platform/mythiclib-fabric/src/main/java; do
            [ ! -d "$src" ] || cp -an "$src"/. target/SVFrameLib/src/main/java/
          done
          [ ! -d seed/fabric-platform/mythiclib-fabric/src/main/resources ] || cp -an seed/fabric-platform/mythiclib-fabric/src/main/resources/. target/SVFrameLib/src/main/resources/

          # M2.0-M2.4 are later real Java source overlays from Mod-dev. Reconstruct
          # each checksum-verified archive and materialize missing MythicLib source
          # into the canonical SVFrameLib tree; existing newer files always win.
          for ver in m2.0 m2.1 m2.2 m2.3 m2.4; do
            root="moddev/fabric-mmo-ports/overlay-$ver"
            [ -d "$root" ] || continue
            if [ -x "$root/reconstruct-source.sh" ]; then
              "$root/reconstruct-source.sh"
            else
              bash "$root/reconstruct-source.sh"
            fi
            archive="$root/source.tar.gz"
            out="overlays/$ver"
            mkdir -p "$out"
            tar -xzf "$archive" -C "$out"
            while IFS= read -r src; do
              if [ -d "$src/io/lumine/mythic/lib" ]; then
                mkdir -p target/SVFrameLib/src/main/java/io/lumine/mythic/lib
                cp -an "$src/io/lumine/mythic/lib"/. target/SVFrameLib/src/main/java/io/lumine/mythic/lib/
              fi
              if [ -d "$src/vn/svframe/mythiclibfabric" ]; then
                mkdir -p target/SVFrameLib/src/main/java/vn/svframe/mythiclibfabric
                cp -an "$src/vn/svframe/mythiclibfabric"/. target/SVFrameLib/src/main/java/vn/svframe/mythiclibfabric/
              fi
            done < <(find "$out" -type d -path '*/src/main/java' -print)
            while IFS= read -r res; do
              cp -an "$res"/. target/SVFrameLib/src/main/resources/
            done < <(find "$out" -type d -path '*/src/main/resources' -print)
          done

          cd target
          git config user.name 'SVFrameLib Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add SVFrameLib
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib: materialize complete Mod-dev source overlays'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi
      - name: Full build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd target/SVFrameLib
          gradle --no-daemon --stacktrace clean remapJar
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "svframelib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"name": "SVFrameLib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "1.7.1-fabric"'
          unzip -l "$JAR" | grep -q 'io/lumine/mythic/lib/api/player/MMOPlayerData.class'
          unzip -l "$JAR" | grep -q 'io/lumine/mythic/lib/manager/SkillManager.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/mythiclibfabric/MythicLibFabricMod.class'
          sha256sum "$JAR" | tee build/SVFrameLib-SHA256.txt
      - name: Dedicated Fabric server boot
        shell: bash
        run: |
          set -euo pipefail
          cd target/SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'SVFrameLib online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log
      - name: Publish validated jar
        shell: bash
        run: |
          set -euo pipefail
          cd target
          mkdir -p SVFrameLib/dist
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/dist/server-boot.log
          git add SVFrameLib/dist
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib: publish validated Fabric 1.21.1 jar'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-1.7.1-fabric
          path: |
            target/SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
            target/SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
            target/SVFrameLib/dist/server-boot.log
          if-no-files-found: error
          retention-days: 14
