name: SVFrameLib Fabric 1.21.1

on:
  push:
    branches:
      - svframelib-fabric-1.21.1
    paths:
      - '.github/workflows/svframelib.yml'
      - 'SVFrameLib/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Cobblemon-MMO
        uses: actions/checkout@v4
        with:
          ref: svframelib-fabric-1.21.1
          path: target

      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          repository: aristheg201/Mod-dev
          ref: feature/fabric-mmo-ports
          path: moddev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Materialize expanded SVFrameLib source
        shell: bash
        run: |
          set -euo pipefail

          cat moddev/fabric-mmo-ports/svframelib-final/text-overlay/part* | base64 -d > final-overlay.tar.gz
          echo '30ec6e8bbdc4e9403dc8f32d689971812863b9417c8c39f7a19244b0caa89e80  final-overlay.tar.gz' | sha256sum -c -
          tar -xzf final-overlay.tar.gz -C moddev/fabric-mmo-ports

          gradle --no-daemon -p moddev/fabric-mmo-ports/fabric-platform :mythiclib-fabric:mergeLegacyApiSources

          rm -rf target/SVFrameLib
          mkdir -p target/SVFrameLib/src/main/java target/SVFrameLib/src/main/resources
          cp -a moddev/fabric-mmo-ports/fabric-platform/mythiclib-fabric/src/main/java/. target/SVFrameLib/src/main/java/
          cp -a moddev/fabric-mmo-ports/fabric-platform/mythiclib-fabric/src/main/resources/. target/SVFrameLib/src/main/resources/
          cp -a moddev/fabric-mmo-ports/mythiclib-runtime/src/main/java/. target/SVFrameLib/src/main/java/
          if [ -d moddev/fabric-mmo-ports/mythiclib-runtime/src/main/resources ]; then cp -a moddev/fabric-mmo-ports/mythiclib-runtime/src/main/resources/. target/SVFrameLib/src/main/resources/; fi
          if [ -d moddev/fabric-mmo-ports/common-runtime/src/main/java ]; then cp -a moddev/fabric-mmo-ports/common-runtime/src/main/java/. target/SVFrameLib/src/main/java/; fi
          if [ -d moddev/fabric-mmo-ports/common-runtime/src/main/resources ]; then cp -a moddev/fabric-mmo-ports/common-runtime/src/main/resources/. target/SVFrameLib/src/main/resources/; fi
          cp -a moddev/fabric-mmo-ports/fabric-platform/mythiclib-fabric/build/generated/legacy-api-merged-src/. target/SVFrameLib/src/main/java/

          cat > target/SVFrameLib/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'SVFrameLib'
          EOF

          cat > target/SVFrameLib/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.18.4
          fabric_api_version=0.116.9+1.21.1
          loom_version=1.7.4
          EOF

          cat > target/SVFrameLib/build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
          }
          group = 'vn.svframe.fabricmmo'
          version = '1.7.1-fabric'
          base { archivesName = 'SVFrameLib' }
          repositories {
              mavenCentral()
              maven { url = 'https://maven.fabricmc.net/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
              compileOnly 'net.luckperms:api:5.4'
          }
          tasks.withType(JavaCompile).configureEach {
              options.release = 21
              options.encoding = 'UTF-8'
          }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
              withSourcesJar()
          }
          processResources {
              filesMatching('fabric.mod.json') { expand version: project.version }
          }
          EOF

          cat > target/SVFrameLib/README.md <<'EOF'
          # SVFrameLib

          Native Fabric 1.21.1 port of MythicLib 1.7.1 for Fabric Loader >= 0.18.4.
          All compatibility/API Java sources are expanded in this branch; no source-part archive is required to build it.
          EOF

          find target/SVFrameLib/src/main/java -type f -name '*.java' | sort > target/SVFrameLib/SOURCE-LIST.txt
          echo "Expanded Java sources: $(wc -l < target/SVFrameLib/SOURCE-LIST.txt)"

      - name: Commit real source
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'SVFrameLib Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add SVFrameLib
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameLib: commit expanded native Fabric source'
            git push origin HEAD:svframelib-fabric-1.21.1
          fi

      - name: Full build and remap
        shell: bash
        run: |
          set -euo pipefail
          cd target/SVFrameLib
          gradle --no-daemon --stacktrace clean remapJar
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"id": "svframelib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"name": "SVFrameLib"'
          unzip -p "$JAR" fabric.mod.json | grep -q '"version": "1.7.1-fabric"'
          unzip -l "$JAR" | grep -q 'io/lumine/mythic/lib/api/player/MMOPlayerData.class'
          unzip -l "$JAR" | grep -q 'io/lumine/mythic/lib/manager/SkillManager.class'
          unzip -l "$JAR" | grep -q 'vn/svframe/mythiclibfabric/MythicLibFabricMod.class'
          sha256sum "$JAR" | tee build/SVFrameLib-SHA256.txt

      - name: Dedicated Fabric server boot
        shell: bash
        run: |
          set -euo pipefail
          cd target/SVFrameLib
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon --stacktrace runServer > build/svframelib-server.log 2>&1
          status=$?
          set -e
          cat build/svframelib-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'SVFrameLib online' build/svframelib-server.log
          ! grep -q 'Mixin apply failed' build/svframelib-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframelib-server.log
          ! grep -q 'Exception in server tick loop' build/svframelib-server.log

      - name: Publish validated jar
        shell: bash
        run: |
          set -euo pipefail
          cd target
          mkdir -p SVFrameLib/dist
          JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
          cp SVFrameLib/build/SVFrameLib-SHA256.txt SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
          cp SVFrameLib/build/svframelib-server.log SVFrameLib/dist/server-boot.log
          git add SVFrameLib/dist
          git commit -m 'SVFrameLib: publish validated Fabric 1.21.1 jar'
          git push origin HEAD:svframelib-fabric-1.21.1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-1.7.1-fabric
          path: |
            target/SVFrameLib/dist/SVFrameLib-1.7.1-fabric.jar
            target/SVFrameLib/dist/SVFrameLib-1.7.1-fabric.sha256
            target/SVFrameLib/dist/server-boot.log
          if-no-files-found: error
          retention-days: 14
