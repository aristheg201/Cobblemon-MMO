name: SVFrameMMO Fabric 1.21.1 Native Build

on:
  push:
    branches: [svframemmo-fabric-1.21.1]
    paths:
      - '.github/workflows/svframemmo.yml'
      - 'SVFrameMMO/**'
      - 'SVFrameLib/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svframemmo-fabric-1.21.1
          fetch-depth: 1
      - name: Sync dedicated SVFrameLib branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin svframelib-fabric-1.21.1
          LIB_SHA="$(git rev-parse FETCH_HEAD)"
          rm -rf SVFrameLib
          git checkout FETCH_HEAD -- SVFrameLib
          echo "SVFRAMELIB_SHA=$LIB_SHA" >> "$GITHUB_ENV"
          echo "SVFRAMEMMO_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "Using SVFrameLib $LIB_SHA"
          echo "Using SVFrameMMO $GITHUB_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Native source gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=SVFrameMMO/src/main
          COMMANDS="$SRC/java/vn/svframe/svframemmo/command/SVFrameMMOCommands.java"
          SKILLBAR="$SRC/java/vn/svframe/svframemmo/skill/runtime/SkillBarRuntime.java"
          CAST_CONFIG="$SRC/java/vn/svframe/svframemmo/config/SVFrameMMOConfig.java"
          CONFIG="$SRC/resources/defaults/config.yml"
          grep -q '"id": "svframemmo"' "$SRC/resources/fabric.mod.json"
          grep -q '"svframelib": ">=1.7.1-fabric"' "$SRC/resources/fabric.mod.json"
          grep -q '"svframemmo.mixins.json"' "$SRC/resources/fabric.mod.json"
          ! grep -qi 'cobblemon' "$SRC/resources/fabric.mod.json"
          grep -q 'SWAP_ITEM_WITH_OFFHAND' "$SRC/java/vn/svframe/svframemmo/mixin/ServerPlayNetworkHandlerMixin.java"
          grep -q 'onUpdateSelectedSlot' "$SRC/java/vn/svframe/svframemmo/mixin/ServerPlayNetworkHandlerMixin.java"
          grep -q 'SKILL_BAR.tick' "$SRC/java/vn/svframe/svframemmo/SVFrameMMO.java"
          grep -q 'configuredSkillIds' "$COMMANDS"
          grep -Fq 'getRawConfig().get("skills")' "$COMMANDS"
          grep -q 'suggestTargetSkills' "$COMMANDS"
          grep -q 'successfully reloaded' "$COMMANDS"
          grep -q 'mode: SKILL_BAR' "$CONFIG"
          grep -q 'open: SWAP_HANDS' "$CONFIG"
          grep -q 'can-creative-cast: false' "$CONFIG"
          grep -q 'action-bar: true' "$CONFIG"
          grep -q 'BLOCK_END_PORTAL_FRAME_FILL,1,2' "$CONFIG"
          grep -q 'SKILL_SCROLLER' "$CAST_CONFIG"
          grep -q 'KEY_COMBOS' "$CAST_CONFIG"
          grep -q 'NONE' "$CAST_CONFIG"
          grep -q 'PlayerEnterCastingModeEvent' "$SKILLBAR"
          grep -q 'PlayerExitCastingModeEvent' "$SKILLBAR"
          grep -q 'PlayerKeyPressEvent' "$SKILLBAR"
          grep -Eq '\((tick|session[.]counter) & 15L\)' "$SKILLBAR"
          grep -q 'legacyText(resolved)' SVFrameLib/src/main/java/vn/svframe/svframelib/message/actionbar/ActionBarHandler.java
          forbidden="$(grep -RIn --binary-files=without-match -Ei 'net[.]Indyuce|io[.]lumine|org[.]bukkit|io[.]papermc|mythicmobs|mmocore|mythiclib|mmoitems|spigot|placeholderapi|worldguard|citizens|vault' "$SRC" --include='*.java' --include='*.json' --include='*.yml' || true)"
          executable_forbidden="$(printf '%s\n' "$forbidden" | grep -Ev ':[0-9]+:[[:space:]]*(//|/[*]|[*]|#)' || true)"
          if [ -n "$executable_forbidden" ]; then
            printf '%s\n' "$executable_forbidden"
            exit 1
          fi
          grep -q '^CLS_WARRIOR_DEEP_WOUND:' "$SRC/resources/defaults/skills/legacy-class-aliases.yml"
          test "$(grep -Ec '^CLS_[A-Z0-9_]+:$' "$SRC/resources/defaults/skills/legacy-class-aliases.yml")" -eq 34
          test "$(grep -REc '^  source: default:' "$SRC/resources/defaults/skills/legacy-class-aliases.yml")" -eq 34
          grep -q 'public boolean isFabric() { return true; }' SVFrameLib/src/main/java/vn/svframe/svframelib/version/ServerVersion.java
      - name: Build dedicated SVFrameLib
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameLib
          gradle --no-daemon --stacktrace clean test remapJar 2>&1 | tee build-combined.log
      - name: Build SVFrameMMO against dedicated SVFrameLib JAR
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMO
          gradle --no-daemon --stacktrace clean test remapJar 2>&1 | tee build-native.log
      - name: Native core smoke
        run: cd SVFrameMMO && gradle --no-daemon nativeCoreSmoke
      - name: Dedicated Fabric combined boot
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMO
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon runServer > build/combined-server.log 2>&1
          status=$?
          set -e
          cat build/combined-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'Loading Minecraft 1.21.1 with Fabric Loader 0.18.4' build/combined-server.log
          grep -q 'SVFrameLib online' build/combined-server.log
          grep -q 'SVFrameLib Fabric online; skills=94,scripts=100,customTriggers=1' build/combined-server.log
          grep -Eq 'SVFrameMMO Fabric online; classes=7,attributes=3,professions=8,expTables=3,skillTrees=6,expSources=[0-9]+/[0-9]+,skills=128' build/combined-server.log
          grep -q 'Done (' build/combined-server.log
          test -f run/config/SVFrameMMO/skills/legacy-class-aliases.yml
          grep -q '^CLS_WARRIOR_DEEP_WOUND:' run/config/SVFrameMMO/skills/legacy-class-aliases.yml
          ! grep -q 'Mixin apply failed' build/combined-server.log
          ! grep -q 'Could not execute entrypoint stage' build/combined-server.log
          ! grep -Eq 'NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|Exception in server tick loop' build/combined-server.log
      - name: Stage exact combined-boot JARs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p combined-validated
          LIB_JAR="$(find SVFrameLib/build/libs -maxdepth 1 -type f -name 'SVFrameLib-*.jar' ! -name '*sources*' | head -1)"
          MMO_JAR="$(find SVFrameMMO/build/libs -maxdepth 1 -type f -name 'SVFrameMMO-*.jar' ! -name '*sources*' | head -1)"
          cp "$LIB_JAR" combined-validated/SVFrameLib-1.7.1-fabric.jar
          cp "$MMO_JAR" combined-validated/SVFrameMMO-1.13.1-fabric.jar
          cp SVFrameMMO/build/combined-server.log combined-validated/server-boot.log
          sha256sum combined-validated/*.jar | tee combined-validated/SHA256SUMS.txt
          printf 'SVFrameLib branch SHA: %s\nSVFrameMMO branch SHA: %s\n' "$SVFRAMELIB_SHA" "$SVFRAMEMMO_SHA" > combined-validated/BRANCH-SHAS.txt
      - name: Upload exact combined-boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameLib-SVFrameMMO-combined-boot
          path: combined-validated
          if-no-files-found: error
          retention-days: 14
