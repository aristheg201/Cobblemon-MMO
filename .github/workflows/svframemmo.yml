name: SVFrameMMO Fabric 1.21.1 Native Build

on:
  push:
    branches: [svframemmo-fabric-1.21.1]
    paths:
      - '.github/workflows/svframemmo.yml'
      - 'SVFrameMMO/**'
      - 'SVFrameLib/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: svframemmo-fabric-1.21.1
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Expand pending native source batch
        if: ${{ hashFiles('SVFrameMMO/.port-batch/part-*') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat SVFrameMMO/.port-batch/part-* | base64 --decode > /tmp/svframemmo-port-batch.tar.gz
          tar -tzf /tmp/svframemmo-port-batch.tar.gz >/dev/null
          tar -xzf /tmp/svframemmo-port-batch.tar.gz -C .
      - name: Native source gate
        shell: bash
        run: |
          set -euo pipefail
          SRC=SVFrameMMO/src/main
          grep -q '"id": "svframemmo"' "$SRC/resources/fabric.mod.json"
          grep -q '"svframelib": ">=1.7.1-fabric"' "$SRC/resources/fabric.mod.json"
          if grep -RIn --binary-files=without-match -Ei 'net[.]Indyuce|io[.]lumine|org[.]bukkit|io[.]papermc|mythicmobs|mmocore|mythiclib|mmoitems|spigot|placeholderapi|worldguard|citizens|vault' "$SRC" --include='*.java' --include='*.json' --include='*.yml'; then exit 1; fi
          grep -q 'class ProfessionManager' "$SRC/java/vn/svframe/svframemmo/manager/ProfessionManager.java"
          grep -q 'class SkillTreeManager' "$SRC/java/vn/svframe/svframemmo/manager/SkillTreeManager.java"
          grep -q 'record SavedClassState' "$SRC/java/vn/svframe/svframemmo/api/player/profess/SavedClassState.java"
          grep -q 'class SkillRuntime' "$SRC/java/vn/svframe/svframemmo/skill/runtime/SkillRuntime.java"
          grep -q 'class SVFrameMMOApi' "$SRC/java/vn/svframe/svframemmo/api/SVFrameMMOApi.java"
          grep -q 'class SVFrameMMOCommands' "$SRC/java/vn/svframe/svframemmo/command/SVFrameMMOCommands.java"
          ! find "$SRC/java/vn/svframe/svframemmo" -type f \( -path '*/social/*' -o -name 'GuildManager.java' -o -name 'PartyManager.java' -o -name 'RequestManager.java' \) | grep -q .
      - name: Build SVFrameLib dependency
        run: cd SVFrameLib && gradle --no-daemon clean remapJar
      - name: Build SVFrameMMO
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMO
          gradle --no-daemon --stacktrace clean test remapJar 2>&1 | tee build-native.log
      - name: Native core smoke
        run: cd SVFrameMMO && gradle --no-daemon nativeCoreSmoke
      - name: Dedicated Fabric server boot
        shell: bash
        run: |
          set -euo pipefail
          cd SVFrameMMO
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout 90s gradle --no-daemon runServer > build/svframemmo-server.log 2>&1
          status=$?
          set -e
          cat build/svframemmo-server.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then exit "$status"; fi
          grep -q 'SVFrameLib Fabric online' build/svframemmo-server.log
          grep -q 'SVFrameMMO Fabric online' build/svframemmo-server.log
          ! grep -q 'Could not execute entrypoint stage' build/svframemmo-server.log
          ! grep -Eq 'NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError' build/svframemmo-server.log
      - name: Stage validated source and artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SVFrameMMO/validated
          JAR="$(find SVFrameMMO/build/libs -maxdepth 1 -name 'SVFrameMMO-*.jar' ! -name '*sources*' | head -1)"
          cp "$JAR" SVFrameMMO/validated/SVFrameMMO-1.13.1-fabric.jar
          sha256sum "$JAR" | tee SVFrameMMO/validated/SVFrameMMO-1.13.1-fabric.sha256
          cp SVFrameMMO/build/svframemmo-server.log SVFrameMMO/validated/server-boot.log
          git config user.name 'SVFrame Build'
          git config user.email 'actions@users.noreply.github.com'
          git add -A SVFrameMMO/src SVFrameMMO/validated
          if [ -d SVFrameMMO/.port-batch ]; then git rm -rf SVFrameMMO/.port-batch; fi
          if [ -f SVFrameMMO/.port-batch.zip ]; then git rm -f SVFrameMMO/.port-batch.zip; fi
          if [ -e noop ]; then git rm -f noop; fi
          if ! git diff --cached --quiet; then
            git commit -m 'SVFrameMMO: validate native RPG core [skip ci]'
            git push origin HEAD:svframemmo-fabric-1.21.1
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SVFrameMMO-native-fabric
          path: |
            SVFrameMMO/validated
            SVFrameMMO/build/libs/*.jar
            SVFrameMMO/build-native.log
            SVFrameMMO/build/svframemmo-server.log
            SVFrameMMO/src
          if-no-files-found: warn
          retention-days: 14
