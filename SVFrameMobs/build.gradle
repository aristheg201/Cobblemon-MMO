plugins { id 'fabric-loom' version "${loom_version}" }
group = 'vn.svframe'
version = '0.1.0-fabric'
base { archivesName = 'SVFrameMobs' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation files('../SVFrameLib/build/libs/SVFrameLib-1.7.2-fabric.jar')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { useJUnitPlatform() }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
processResources {
    inputs.property("version", project.version)
 filesMatching('fabric.mod.json') { expand version: project.version } }
