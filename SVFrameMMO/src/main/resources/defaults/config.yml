config-version: 11

auto-save:
  enabled: true
  interval: 1800

# Native userdata storage. YAML mirrors the original file-per-player backend.
# JSON is retained as a migration/export backend for worlds created by earlier native builds.
storage:
  backend: YAML
  yaml-directory: svframemmo-userdata
  auto-migrate-json: true

# MySQL-compatible userdata backend. Set storage.backend to MYSQL when enabled.
mysql:
  enabled: false
  host: localhost
  port: 3306
  database: minecraft
  user: mmolover
  pass: change-me
  maxPoolSize: 10
  maxLifeTime: 300000
  connectionTimeOut: 10000
  leakDetectionThreshold: 150000
  properties:
    cachePrepStmts: true
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048
  userdata-table-name: svframemmo_playerdata

default-playerdata:
  level: 1
  class-points: 0
  skill-points: 0
  attribute-points: 0
  reallocation-points: 0
  health: 20
  mana: 100
  stellium: 100
  stamina: 100

passive-skill-needs-binding: true
save-default-class-info: false
player-resource-tick-period: 20

# Global active-skill cooldown in ticks. Set to 0 to disable.
global-skill-cooldown: 10

# Prevent mobs created by vanilla monster spawners from granting kill-mob MMO EXP.
prevent-spawner-xp: true

# MMOCore-compatible generator policy. When false, cobblestone, obsidian and basalt formed by
# lava/water generator mechanics are treated as player-placed for mining EXP and mining triggers.
should-cobblestone-generators-give-exp: false

# Skill-tree command/UI behavior retained from MMOCore.
enable-global-skill-tree-gui: true
enable-specific-skill-tree-gui: true
skill-tree-scroll-step-x: 1
skill-tree-scroll-step-y: 1

# Sneak-right-click another player to inspect their Player Stats GUI.
shift-click-player-profile-check: false

# Force newly-created native player data to choose a non-default class before closing the selection flow.
# Existing player data is migrated as already chosen the first time this feature is enabled.
force-class-selection: true

# Creative players cannot enter skill casting unless explicitly enabled.
can-creative-cast: false

combat-log:
  timer: 10

share-across-classes:
  experience: false
  skill-points: false
  attribute-points: false
  skill-reallocation-points: false
  attribute-reallocation-points: false

# Supported modes: SKILL_BAR, SKILL_SCROLLER, KEY_COMBOS, NONE.
# SKILL_BAR casting. F is Minecraft's vanilla SWAP_HANDS key.
skill-casting:
  mode: SKILL_BAR
  open: SWAP_HANDS
  ignore-sneak: false
  use-lowest-keybinds: true

  # Optional. When present this is measured in ticks and must be > 0.
  # time-out: 100

  message:
    enter:
      message: '&e&l☄ &a&lSKILL CASTING &e&l☄'
      action-bar: true
      duration: 20
      priority: 31
      sound: BLOCK_END_PORTAL_FRAME_FILL,1,2
    quit:
      message: '&e&l☄ &c&lSKILL CASTING &e&l☄'
      action-bar: true
      duration: 20
      priority: 31
      sound: BLOCK_FIRE_EXTINGUISH,1,2

  action-bar:
    split: '&7 &7 - &7 '
    ready: '&6[{index}] &a&l{skill}'
    on-cooldown: '&6[{index}] &c&l{skill} &6(&c{cooldown}&6)'
    no-mana: '&6[{index}] &9&l{skill}'
    no-stamina: '&6[{index}] &9&l{skill}'

action-bar:
  enabled: true
  ticks-to-update: 5
  format: '&c❤ {health}/{max_health} &f| {mana_icon} {mana}/{max_mana} &f| &7⛨ {armor}'

# Native custom mining. Empty conditions means server-wide.
custom-mining:
  enable: true
  enable-tool-restrictions: false
  protect-vanilla-blocks: false

# Convert earned vanilla XP into class XP. Vanilla XP is additionally suppressed when override-vanilla-exp is true.
vanilla-exp-redirection:
  enabled: false
  ratio: 0.8

override-vanilla-exp: true

death-exp-loss:
  enabled: false
  percent: 30

# Native PvP-mode parity. Requires an SVFrameLib region/flag provider to define pvp-mode regions.
pvp_mode:
  enabled: false
  min_level: 0
  max_level_difference: 10
  combat_timeout: 30
  invulnerability:
    time:
      region_change: 60
      command: 30
    can_damage: false
    apply_to_pvp_flag: true
  cooldown:
    region_enter: 20
    region_leave: 20
    combat: 45
    toggle_on: 5
    toggle_off: 3

# Currency backend routed through SVFrameLib CurrencyService.
economy:
  currency: beconomy:primary
