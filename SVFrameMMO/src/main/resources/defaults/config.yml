config-version: 11

auto-save:
  enabled: true
  interval: 1800

default-playerdata:
  level: 1
  class-points: 0
  skill-points: 0
  attribute-points: 0
  reallocation-points: 0
  health: 20
  mana: 100
  stellium: 100
  stamina: 100

passive-skill-needs-binding: true
save-default-class-info: false
player-resource-tick-period: 20

combat-log:
  timer: 10

# Progress that can be carried from the class the player leaves into the class
# they select. Class-specific skills, attributes, trees and unlocks always remain
# isolated in per-class snapshots.
share-across-classes:
  experience: false
  skill-points: false
  attribute-points: false
  skill-reallocation-points: false
  attribute-reallocation-points: false

