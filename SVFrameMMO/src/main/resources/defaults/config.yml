config-version: 11

auto-save:
  enabled: true
  interval: 1800

default-playerdata:
  level: 1
  class-points: 0
  skill-points: 0
  attribute-points: 0
  reallocation-points: 0
  health: 20
  mana: 100
  stellium: 100
  stamina: 100

passive-skill-needs-binding: true
save-default-class-info: false
player-resource-tick-period: 20

combat-log:
  timer: 10

# Progress that can be carried from the class the player leaves into the class
# they select. Class-specific skills, attributes, trees and unlocks always remain
# isolated in per-class snapshots.
share-across-classes:
  experience: false
  skill-points: false
  attribute-points: false
  skill-reallocation-points: false
  attribute-reallocation-points: false

# Native MMOCore-style skill bar. The F key is Minecraft's vanilla SWAP_HANDS action;
# SVFrameMMO consumes that packet while this casting mode is active. No client keybind mod is required.
skill-casting:
  open: SWAP_HANDS
  ignore-sneak: false
  use-lowest-keybinds: true
  message:
    enter:
      message: '&e&l☄ &a&lSKILL CASTING &e&l☄'
    quit:
      message: '&e&l☄ &c&lSKILL CASTING &e&l☄'
  action-bar:
    split: '&7 - &7'
    ready: '&6[{index}] &a&l{skill}'
    on-cooldown: '&6[{index}] &c&l{skill} &6(&c{cooldown}&6)'
    no-mana: '&6[{index}] &9&l{skill}'
    no-stamina: '&6[{index}] &9&l{skill}'

# Default persistent action bar. Individual classes may override this with their own action-bar value.
action-bar:
  enabled: true
  ticks-to-update: 5
  format: '&c❤ {health}/{max_health} &f| {mana_icon} {mana}/{max_mana} &f| &7⛨ {armor}'
