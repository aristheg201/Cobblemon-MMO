    material: 'vanilla{type=GOLD_ORE}'
    drop-table:
      items:
        - 'vanilla{type=GOLD_ORE}'
    options:
      vanilla-drops: false
    regen:
      time: 2000
      temp-block: 'vanilla{type=STONE}'
    triggers:
      - 'exp{profession=mining;amount=5}'
