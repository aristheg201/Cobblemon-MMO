plugins { id 'fabric-loom' version "${loom_version}" }
group = 'vn.svframe'
version = '1.13.1-fabric'
base { archivesName = 'SVFrameMMO' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
 modImplementation files('../SVFrameLib/build/libs/SVFrameLib-1.7.1-fabric.jar')
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
processResources { filesMatching('fabric.mod.json') { expand version: project.version } }

tasks.register('nativeCoreSmoke', JavaExec) {
    dependsOn classes
    group = 'verification'
    description = 'Runs SVFrameMMO native core smoke checks on the Loom runtime classpath.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'vn.svframe.svframemmo.validation.NativeCoreSmoke'
}
